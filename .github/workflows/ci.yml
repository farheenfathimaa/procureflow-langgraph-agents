name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOCK_LLM: "true"
      EMBEDDING_BACKEND: hash
      CHECKPOINTER_BACKEND: memory
      DATABASE_URL: ""
      REDIS_URL: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python 3.11 --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests (no external APIs)
        run: uv run pytest
