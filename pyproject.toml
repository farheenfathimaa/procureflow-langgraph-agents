[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procureflow-langgraph-agents"
version = "0.1.0"
description = "Multi-agent procurement assistant built with LangGraph, FastAPI, hybrid RAG and human-in-the-loop approval."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Farheen Fathima" }]
keywords = ["langgraph", "agents", "procurement", "rag", "fastapi", "mcp"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "langgraph>=0.6,<0.7",
  "langgraph-checkpoint-postgres>=2.0,<3",
  "langchain-core>=0.3.72,<0.4",
  "langsmith>=0.2,<1",
  "litellm>=1.55,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "redis>=5,<9",
  "rank-bm25>=0.2.2,<1",
  "numpy>=1.26,<3",
  "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-api-python-client>=2.149,<3",
  "mcp>=2.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.2,<6",
]
eval = [
  "ragas==0.2.15",
  "datasets>=3.0,<4",
  "pandas>=2.2,<3",
  "langchain>=0.3,<0.4",
  "langchain-community>=0.3,<0.4",
  "langchain-openai>=0.2,<0.3",
  "langchain-groq>=0.2,<0.3",
  "langchain-huggingface>=0.1,<0.2",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.7,<1",
  "httpx>=0.27,<1",
]
all = [
  "sentence-transformers>=3.2,<6",
  "ragas==0.2.15",
  "datasets>=3.0,<4",
  "pandas>=2.2,<3",
  "langchain>=0.3,<0.4",
  "langchain-community>=0.3,<0.4",
  "langchain-openai>=0.2,<0.3",
  "langchain-groq>=0.2,<0.3",
  "langchain-huggingface>=0.1,<0.2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "agents*", "rag*", "connectors*", "mcp_server*", "evals*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
rag = ["data/*.jsonl"]
evals = ["*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
  "ignore:LangChainPendingDeprecationWarning",
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"evals/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
